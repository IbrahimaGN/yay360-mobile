# Livraison continue de l'application mobile YAY360 : APK Android publié en « Release » GitHub.
#
# Déclenchement : uniquement après une exécution RÉUSSIE de « CI mobile » sur main.
# Validation humaine : environnement GitHub « production » avec validateur obligatoire.
# L'APK est construit pour l'API de production (variable API_URL de l'environnement).
# Pas de publication sur le Play Store : l'APK est signé avec la clé de debug (APK de test).
# Retour arrière : réinstaller l'APK d'une Release précédente (onglet « Releases » du dépôt).
#
# Variable (Settings → Environments → production) :
#   API_URL   URL publique de l'API, ex. https://yay360-api.onrender.com

name: CD mobile

on:
  workflow_run:
    workflows: ["CI mobile"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-production-mobile
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  publier-apk:
    name: Publier l'APK (Release GitHub)
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # création de la Release et de son étiquette
    environment:
      name: production
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - name: Vérifier la configuration
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [[ "$API_URL" != https://* ]]; then
            echo "::error::La variable API_URL de l'environnement production doit être une URL https."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Construire l'APK de production
        run: >-
          flutter build apk --release
          --dart-define=API_BASE_URL=${{ vars.API_URL }}
          --build-number=${{ github.run_number }}

      - name: Publier la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([0-9.]+).*/\1/')
          tag="mobile-v${version}-${{ github.run_number }}"
          cp build/app/outputs/flutter-apk/app-release.apk "yay360-${version}-${{ github.run_number }}.apk"
          gh release create "$tag" "yay360-${version}-${{ github.run_number }}.apk" \
            --target "$SHA" \
            --title "YAY360 mobile ${version} (build ${{ github.run_number }})" \
            --notes "APK Android construit depuis ${SHA} pour l'API ${{ vars.API_URL }}. Signé avec la clé de debug : réservé aux tests, non publié sur le Play Store."
          echo "Release publiée : $tag"

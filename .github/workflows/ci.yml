# Intégration continue de l'application mobile YAY360 (Flutter).
# Analyse statique, tests, puis construction de l'APK Android et de la version Web.
# Aucune publication sur un store ici : la livraison reste une décision humaine.

name: CI mobile

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Même version que le poste de développement (flutter --version).
  FLUTTER_VERSION: '3.47.9'
  # URL de l'API intégrée au build. Variable de dépôt facultative (Settings > Variables).
  API_BASE_URL: ${{ vars.API_BASE_URL || 'http://10.0.2.2:8080' }}

jobs:
  analyse-et-tests:
    name: Analyse et tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Analyse statique
        run: flutter analyze

      # Inclut les tests de contraste de la palette (test/theme_test.dart).
      - name: Tests
        run: flutter test

  apk-android:
    name: APK Android
    runs-on: ubuntu-latest
    needs: analyse-et-tests
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Le projet Android cible Java 17 (android/app/build.gradle.kts).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get --enforce-lockfile

      # Signé avec la clé de debug (configuration actuelle du projet) : APK de test, pas de store.
      - name: Construire l'APK
        run: >-
          flutter build apk --release
          --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}
          --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: yay360-mobile-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  web:
    name: Version Web
    runs-on: ubuntu-latest
    needs: analyse-et-tests
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Construire la version Web
        run: flutter build web --release --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'http://localhost:8080' }}

      - uses: actions/upload-artifact@v4
        with:
          name: yay360-mobile-web-${{ github.sha }}
          path: build/web/
          retention-days: 14

  qualite-sonarqube:
    name: Qualité du code (SonarQube Cloud)
    runs-on: ubuntu-latest
    needs: analyse-et-tests
    timeout-minutes: 15
    # Désactivé tant que la variable SONAR_ORGANIZATION n'est pas définie dans le dépôt.
    if: ${{ vars.SONAR_ORGANIZATION != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get --enforce-lockfile

      # Tests avec couverture (rapport lcov lu par SonarQube Cloud).
      - name: Tests et couverture
        run: flutter test --coverage

      - name: Analyse SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}

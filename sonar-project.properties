# Analyse SonarQube Cloud de l'application mobile YAY360 (Flutter / Dart).
# L'organisation est fournie par la CI (variable GitHub SONAR_ORGANIZATION).
sonar.projectKey=IbrahimaGN_yay360-mobile
sonar.projectName=YAY360 - Application mobile

sonar.sources=lib
sonar.tests=test
sonar.exclusions=**/*.g.dart,**/*.freezed.dart
sonar.sourceEncoding=UTF-8
sonar.dart.lcov.reportPaths=coverage/lcov.info

# Détection des duplications : theme.dart déclare les palettes claire et sombre
# (deux listes de couleurs de même structure), ce n'est pas de la logique répétée.
sonar.cpd.exclusions=lib/theme.dart

# Les fichiers de test ne sont pas du code à couvrir.
sonar.coverage.exclusions=test/**
